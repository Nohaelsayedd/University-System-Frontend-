<div class="student-form">
  <button routerLink="/students/add">Add Student</button>
</div>
<div class="search">
    <input [(ngModel)]="studentName" placeholder="Search....">
</div>

<div class="cards-container">
  <app-student-card *ngFor="let s of filteredStudents" 
  [id]="s.id" 
  [name]="s.firstName + ' ' + s.lastName" 
  [lvl]="s.lvl" 
  (delete)="onDeleteStudent($event)">
   <!--delete hena refers to output channel f el service w el $emit da el haga el emitted (id in this case)-->
</app-student-card>
</div>

<p *ngIf="filteredStudents.length === 0">No students found</p>
