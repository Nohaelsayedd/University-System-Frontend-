<div class="students-page">
  <h2>Students</h2>

  <input
    type="text"
    placeholder="Search by name..."
    [(ngModel)]="searchTerm"
  />

  <div class="cards">
    <app-student-card
      *ngFor="let student of filteredStudents"
      [student]="student"
    ></app-student-card>
  </div>

  <p *ngIf="filteredStudents.length === 0">No students match your search.</p>
</div>
